<svg version="1.0" xmlns="http://www.w3.org/2000/svg"
  width="441.000000pt" height="378.000000pt" viewBox="0 0 441.000000 378.000000"
  preserveAspectRatio="xMidYMid meet">

  <defs>
    <!-- Gradiente de energia verde esmeralda para o feixe vertical -->
    <linearGradient id="toxicBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#A3E635" stop-opacity="0" />
    </linearGradient>

    <style>
      /* Levitação rítmica com pulsação verde neon/esmeralda */
      .mystic-sigil {
        transform-origin: 220.5px 189px;
        animation: pulseRune 2.8s ease-in-out infinite alternate;
      }

      @keyframes pulseRune {
        0% {
          transform: scale(0.96) translateY(4px);
          filter: drop-shadow(0 0 4px rgba(34, 197, 94, 0.4));
        }
        50% {
          transform: scale(1.02) translateY(-4px);
          filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.85)) drop-shadow(0 0 30px rgba(74, 222, 128, 0.6));
        }
        100% {
          transform: scale(1.06) translateY(-8px);
          filter: drop-shadow(0 0 24px rgba(34, 197, 94, 1)) drop-shadow(0 0 45px rgba(163, 230, 53, 0.75));
        }
      }

      /* Disparo do feixe de energia verde */
      .energy-ray {
        animation: raySurge 2.8s ease-in-out infinite alternate;
        transform-origin: 220.5px 189px;
      }

      @keyframes raySurge {
        0% {
          opacity: 0.15;
          transform: scaleX(0.7);
        }
        100% {
          opacity: 0.85;
          transform: scaleX(1.3);
        }
      }

      /* Ondas de choque verdes em expansão */
      .shockwave {
        transform-origin: 220.5px 189px;
        animation: waveExpand 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        opacity: 0;
      }

      .shockwave-delayed {
        animation-delay: 1.75s;
      }

      @keyframes waveExpand {
        0% {
          transform: scale(0.5);
          opacity: 0.85;
        }
        70% {
          opacity: 0.4;
        }
        100% {
          transform: scale(2.2);
          opacity: 0;
        }
      }
    </style>
  </defs>

  <!-- Feixe de luz vertical verde emanando do artefato -->
  <polygon points="170,0 271,0 240,250 201,250" fill="url(#toxicBeam)" class="energy-ray" />

  <!-- Ondas de choque expansivas em verde esmeralda e lima neon -->
  <circle cx="220.5" cy="189" r="60" fill="none" stroke="#22C55E" stroke-width="2" class="shockwave" />
  <circle cx="220.5" cy="189" r="60" fill="none" stroke="#A3E635" stroke-width="2" class="shockwave shockwave-delayed" />

  <!-- Símbolo Vetorial Original -->

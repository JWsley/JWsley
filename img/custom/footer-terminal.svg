<svg version="1.0" xmlns="http://www.w3.org/2000/svg"
  width="100%" height="95px" viewBox="0 0 900 95"
  preserveAspectRatio="xMidYMid meet">

  <defs>
    <linearGradient id="footerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0" />
      <stop offset="25%" stop-color="#39d353" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#79ff88" stop-opacity="1" />
      <stop offset="75%" stop-color="#39d353" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#39d353" stop-opacity="0" />
    </linearGradient>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 700;
  src: url(data:font/truetype;base64,) format('truetype');
}

      .footer-title {
        font-family: 'Fira Code', monospace;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 2.5px;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .footer-sub {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-anchor: middle;
        dominant-baseline: central;
        fill: #26a641;
      }

      .base-footer {
        fill: #39d353;
        filter: drop-shadow(0 0 10px rgba(57, 211, 83, 0.9));
        animation: footerJitter 4.5s infinite;
        transform-origin: 450px 38px;
      }

      @keyframes footerJitter {
        0%, 65%, 78%, 90%, 100% {
          transform: translate(0, 0);
          filter: drop-shadow(0 0 10px rgba(57, 211, 83, 0.9));
        }
        67% {
          transform: translate(-1.5px, 1px);
          filter: drop-shadow(0 0 20px rgba(121, 255, 136, 1));
        }
        70% {
          transform: translate(2px, -1px);
        }
        88% {
          transform: translate(1px, -1px);
        }
      }

      .glitch-footer-1 {
        fill: #79ff88;
        filter: drop-shadow(0 0 14px #79ff88);
        transform-origin: 450px 38px;
        animation: glitchFoot1 4.5s infinite;
      }

      @keyframes glitchFoot1 {
        0%, 65%, 75%, 88%, 100% {
          opacity: 0;
          transform: translate(0, 0);
        }
        67% {
          opacity: 0.95;
          transform: translate(-8px, -2px) skewX(-6deg);
        }
        69% {
          opacity: 0.9;
          transform: translate(6px, 2px) skewX(5deg);
        }
        71% {
          opacity: 0;
          transform: translate(0, 0);
        }
        89% {
          opacity: 0.95;
          transform: translate(-7px, -1px) skewX(5deg);
        }
        91% {
          opacity: 0;
          transform: translate(0, 0);
        }
      }

      .glitch-footer-2 {
        fill: #10b981;
        filter: drop-shadow(0 0 12px #047857);
        transform-origin: 450px 38px;
        animation: glitchFoot2 4.5s infinite;
      }

      @keyframes glitchFoot2 {
        0%, 65%, 75%, 88%, 100% {
          opacity: 0;
          transform: translate(0, 0);
        }
        68% {
          opacity: 0.9;
          transform: translate(7px, 2px) skewX(6deg);
        }
        70% {
          opacity: 0.95;
          transform: translate(-6px, -1px) skewX(-5deg);
        }
        72% {
          opacity: 0;
          transform: translate(0, 0);
        }
        90% {
          opacity: 0.9;
          transform: translate(7px, 1px) skewX(-5deg);
        }
        92% {
          opacity: 0;
          transform: translate(0, 0);
        }
      }
    </style>
  </defs>

  <!-- Linha Superior de Energia -->
  <line x1="80" y1="8" x2="820" y2="8" stroke="url(#footerGlow)" stroke-width="2.5" />
  
  <!-- Marcadores laterais -->
  <polygon points="75,4 85,8 75,12" fill="#39d353" />
  <polygon points="825,4 815,8 825,12" fill="#39d353" />

  <!-- Titulo com Glitch -->
  <g>
    <text x="450" y="42" class="footer-title glitch-footer-2">◈ SYSTEM STATUS: ONLINE // ALL UNITS OPERATIONAL ◈</text>
    <text x="450" y="42" class="footer-title glitch-footer-1">◈ SYSTEM STATUS: ONLINE // ALL UNITS OPERATIONAL ◈</text>
    <text x="450" y="42" class="footer-title base-footer">◈ SYSTEM STATUS: ONLINE // ALL UNITS OPERATIONAL ◈</text>
  </g>

  <!-- Subtitulo de Finalizacao -->
  <text x="450" y="75" class="footer-sub">END_TRANSMISSION // CORE_STABLE // JWSLEY_SYSTEM</text>
</svg>

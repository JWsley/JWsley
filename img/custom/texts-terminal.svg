<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 65" width="100%" height="65">
  <defs>
    <!-- Mascara de Digitacao Frase 1 -->
    <clipPath id="clip1">
      <rect x="0" y="0" width="0" height="65">
        <animate attributeName="width" dur="12s" repeatCount="indefinite"
          values="0; 550; 550; 0; 0"
          keyTimes="0; 0.12; 0.28; 0.32; 1" />
      </rect>
    </clipPath>

    <!-- Mascara de Digitacao Frase 2 -->
    <clipPath id="clip2">
      <rect x="0" y="0" width="0" height="65">

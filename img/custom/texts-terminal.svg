      <text x="50%" y="33" class="text-base" fill="#39d353" filter="drop-shadow(0 0 6px rgba(57, 211, 83, 0.85))">
        [ INITIALIZING ENVIRONMENT... ]
      </text>
    </g>

    <!-- Camada Glitch 1: Verde Lima Hiper-Brilhante com Deslocamento e Skew -->
    <g opacity="0">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
        values="0; 0; 0.95; 0; 0.85; 0; 0; 0.9; 0; 0"
        keyTimes="0; 0.44; 0.46; 0.48; 0.50; 0.52; 0.82; 0.85; 0.88; 1" />
      <animateTransform attributeName="transform" type="translate" dur="3s" repeatCount="indefinite" additive="sum"

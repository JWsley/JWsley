    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 700;
  src: url(data:font/truetype;base64,) format('truetype');
}

      .text-base {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 20px;
        font-weight: 700;
        dominant-baseline: central;
        text-anchor: middle;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- ==========================================================
       FRASE 1: [ INITIALIZING ENVIRONMENT... ] (0s a 4s / 33.3%)
       ========================================================== -->
  <g clip-path="url(#clip1)">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
      values="1; 1; 0; 0; 0"
      keyTimes="0; 0.31; 0.33; 0.99; 1" />

    <!-- Camada Base com Tremor Jitter -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="3s" repeatCount="indefinite"
        values="0 0; 0 0; -1.5 1; 2 -1; -1 0; 0 0; 0 0; 1.5 -1; -2 0; 0 0"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 65" width="100%" height="65">
  <defs>
    <!-- Máscara de digitação da Frase 1 -->
    <clipPath id="type-clip-1">
      <rect x="15" y="0" width="0" height="65">
        <animate attributeName="width" dur="12s" repeatCount="indefinite"
          values="0; 520; 520; 0; 0"
          keyTimes="0; 0.10; 0.28; 0.32; 1" />
      </rect>
    </clipPath>

    <!-- Máscara de digitação da Frase 2 -->
    <clipPath id="type-clip-2">
      <rect x="15" y="0" width="0" height="65">
        <animate attributeName="width" dur="12s" repeatCount="indefinite"
          values="0; 0; 520; 520; 0; 0"
          keyTimes="0; 0.333; 0.44; 0.61; 0.65; 1" />
      </rect>
    </clipPath>

    <!-- Máscara de digitação da Frase 3 -->
    <clipPath id="type-clip-3">
      <rect x="15" y="0" width="0" height="65">
        <animate attributeName="width" dur="12s" repeatCount="indefinite"
          values="0; 0; 520; 520; 0; 0"
          keyTimes="0; 0.666; 0.77; 0.94; 0.98; 1" />
      </rect>
    </clipPath>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 700;
  src: url(data:font/truetype;base64,) format('truetype');
}

      .text-base {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 20px;
        font-weight: 700;
        dominant-baseline: central;
        text-anchor: middle;
        letter-spacing: 1px;
      }

      /* Brilho terminal verde fosforescente */
      .glow-green {
        fill: #39d353;
        filter: drop-shadow(0 0 6px rgba(57, 211, 83, 0.85));
      }

      /* Camada Glitch 1: Verde Lima */
      .glitch-1 {
        fill: #79ff88;
        filter: drop-shadow(0 0 8px #79ff88);
        opacity: 0;
        animation: glitchSpasm1 4s infinite;
      }

      /* Camada Glitch 2: Verde Matrix */
      .glitch-2 {
        fill: #10b981;
        filter: drop-shadow(0 0 6px #047857);
        opacity: 0;
        animation: glitchSpasm2 4s infinite reverse;
      }

      /* Ciclo das frases */
      .phrase-1 {
        animation: phraseCycle1 12s infinite;
        clip-path: url(#type-clip-1);
      }
      .phrase-2 {
        animation: phraseCycle2 12s infinite;
        clip-path: url(#type-clip-2);
      }
      .phrase-3 {
        animation: phraseCycle3 12s infinite;
        clip-path: url(#type-clip-3);
      }

      @keyframes phraseCycle1 {
        0%, 31% { opacity: 1; }
        32%, 100% { opacity: 0; }
      }
      @keyframes phraseCycle2 {
        0%, 32.9% { opacity: 0; }
        33.3%, 64% { opacity: 1; }
        65%, 100% { opacity: 0; }
      }
      @keyframes phraseCycle3 {
        0%, 65.9% { opacity: 0; }
        66.6%, 97% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      /* Espasmos do Glitch */
      @keyframes glitchSpasm1 {
        0%, 45% {
          opacity: 0;
          transform: translate(0, 0);
        }
        46% {
          opacity: 0.95;
          transform: translate(-6px, -2px) skewX(-6deg);
        }
        48% {
          opacity: 0.9;
          transform: translate(6px, 2px) skewX(4deg);
        }
        50% {
          opacity: 0.85;
          transform: translate(-8px, 1px);
        }
        52% {
          opacity: 0.95;
          transform: translate(5px, -3px) skewX(-3deg);
        }
        54%, 82% {
          opacity: 0;
          transform: translate(0, 0);
        }
        83% {
          opacity: 0.9;
          transform: translate(-8px, -1px) skewX(5deg);
        }
        85% {
          opacity: 0.95;
          transform: translate(7px, 2px);
        }
        87%, 100% {
          opacity: 0;
          transform: translate(0, 0);
        }
      }

      @keyframes glitchSpasm2 {
        0%, 45% {
          opacity: 0;
          transform: translate(0, 0);
        }
        47% {
          opacity: 0.9;
          transform: translate(6px, 2px) skewX(5deg);
        }
        49% {
          opacity: 0.95;
          transform: translate(-7px, -1px) skewX(-4deg);
        }
        51% {
          opacity: 0.85;
          transform: translate(8px, -2px);
        }
        53%, 83% {
          opacity: 0;
          transform: translate(0, 0);
        }
        84% {
          opacity: 0.9;
          transform: translate(-7px, 2px) skewX(-5deg);
        }
        86% {
          opacity: 0.95;
          transform: translate(6px, -2px);
        }
        88%, 100% {
          opacity: 0;
          transform: translate(0, 0);
        }
      }

      /* Tremor sutil do terminal */
      .terminal-jitter {
        animation: jitter 5s infinite;
      }
      @keyframes jitter {
        0%, 48%, 52%, 85%, 89%, 100% { transform: translate(0, 0); }
        49% { transform: translate(-1px, 1px); }
        50% { transform: translate(2px, -1px); }
        51% { transform: translate(-1px, -1px); }
        86% { transform: translate(1px, 1px); }
        87% { transform: translate(-2px, 0); }
      }
    </style>
  </defs>

  <!-- Fundo transparente sem retângulos de cor ou molduras -->
  <g class="terminal-jitter">
    <!-- Frase 1 -->
    <g class="phrase-1">
      <text x="50%" y="33" class="text-base glitch-2">[ INITIALIZING ENVIRONMENT... ]</text>
      <text x="50%" y="33" class="text-base glitch-1">[ INITIALIZING ENVIRONMENT... ]</text>
      <text x="50%" y="33" class="text-base glow-green">[ INITIALIZING ENVIRONMENT... ]</text>
    </g>

    <!-- Frase 2 -->
    <g class="phrase-2">
      <text x="50%" y="33" class="text-base glitch-2">[ ESTABLISHING SECURE CONNECTION ]</text>
      <text x="50%" y="33" class="text-base glitch-1">[ ESTABLISHING SECURE CONNECTION ]</text>
      <text x="50%" y="33" class="text-base glow-green">[ ESTABLISHING SECURE CONNECTION ]</text>
    </g>

    <!-- Frase 3 -->
    <g class="phrase-3">
      <text x="50%" y="33" class="text-base glitch-2">[ USER: JWsley AUTHORIZED ]</text>
      <text x="50%" y="33" class="text-base glitch-1">[ USER: JWsley AUTHORIZED ]</text>
      <text x="50%" y="33" class="text-base glow-green">[ USER: JWsley AUTHORIZED ]</text>
    </g>
  </g>
</svg>

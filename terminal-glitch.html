<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Glitch - JWsley</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Fira Code', monospace;
      padding: 20px;
      color: #39d353;
    }

    /* Moldura estilo CRT Terminal Cyberpunk com fundo transparente */
    .terminal-container {
      position: relative;
      width: 100%;
      max-width: 620px;
      background: transparent;
      padding: 24px 30px;
      overflow: hidden;
      animation: screenJitter 6s infinite;
    }

    /* Linhas de varredura CRT (Scanlines) */
    .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.45) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 4px, 6px 100%;
      z-index: 10;
      opacity: 0.85;
    }

    /* Feixe de luz CRT passando verticalmente */
    .crt-beam {
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(57, 211, 83, 0.08) 50%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 11;
      animation: crtScan 8s linear infinite;
    }

    /* Header simples do terminal */
    .terminal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(38, 166, 65, 0.2);
      padding-bottom: 10px;
      font-size: 12px;
      color: #26a641;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #39d353;
      border-radius: 50%;
      box-shadow: 0 0 8px #39d353;
      animation: pulseDot 1.5s infinite;
    }

    /* Área central onde o texto digita */
    .terminal-screen {
      position: relative;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Bloco de cada linha */
    .terminal-line {
      position: absolute;
      white-space: nowrap;
      overflow: hidden;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      opacity: 0;
      display: inline-block;
    }

    /* Camada base com brilho de fósforo */
    .glitch-text {
      position: relative;
      color: #39d353;
      text-shadow: 
        0 0 8px rgba(57, 211, 83, 0.8),
        0 0 20px rgba(57, 211, 83, 0.4);
      display: inline-block;
    }

    /* Camadas do Glitch (Pseudo-elementos ::before e ::after) */
    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
    }

    /* Camada 1: Verde Lima Hiper-Brilhante (deslocamento para a esquerda) */
    .glitch-text::before {
      color: #79ff88;
      text-shadow: -2px 0 10px #79ff88;
      animation: glitchSpasm1 4s infinite;
    }

    /* Camada 2: Verde Escuro Matrix (deslocamento para a direita) */
    .glitch-text::after {
      color: #10b981;
      text-shadow: 2px 0 8px #047857;
      animation: glitchSpasm2 4s infinite reverse;
    }

    /* Cursor piscante */
    .cursor {
      display: inline-block;
      width: 10px;
      height: 22px;
      background-color: #39d353;
      vertical-align: middle;
      margin-left: 4px;
      box-shadow: 0 0 8px #39d353;
      animation: blinkCursor 0.75s step-end infinite;
    }

    /* =======================================================
       ANIMAÇÃO DE CICLO DAS 3 FRASES (12 segundos no total)
       Linha 1: 0s a 4s (33%)
       Linha 2: 4s a 8s (33% a 66%)
       Linha 3: 8s a 12s (66% a 100%)
       ======================================================= */

    .line-1 {
      animation: 
        cyclePhase1 12s infinite,
        typeInPhase1 12s steps(33, end) infinite;
    }

    .line-2 {
      animation: 
        cyclePhase2 12s infinite,
        typeInPhase2 12s steps(35, end) infinite;
    }

    .line-3 {
      animation: 
        cyclePhase3 12s infinite,
        typeInPhase3 12s steps(28, end) infinite;
    }

    /* Controle de visibilidade / ativação de cada fase */
    @keyframes cyclePhase1 {
      0%, 30% { opacity: 1; visibility: visible; }
      33%, 100% { opacity: 0; visibility: hidden; }
    }

    @keyframes cyclePhase2 {
      0%, 32.9% { opacity: 0; visibility: hidden; }
      33.3%, 63% { opacity: 1; visibility: visible; }
      66%, 100% { opacity: 0; visibility: hidden; }
    }

    @keyframes cyclePhase3 {
      0%, 65.9% { opacity: 0; visibility: hidden; }
      66.6%, 96.5% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* Digitação da Linha 1 */
    @keyframes typeInPhase1 {
      0% { width: 0; }
      12% { width: 440px; }
      27% { width: 440px; }
      31% { width: 0; }
      33%, 100% { width: 0; }
    }

    /* Digitação da Linha 2 */
    @keyframes typeInPhase2 {
      0%, 33.3% { width: 0; }
      45% { width: 465px; }
      60% { width: 465px; }
      64% { width: 0; }
      66.6%, 100% { width: 0; }
    }

    /* Digitação da Linha 3 */
    @keyframes typeInPhase3 {
      0%, 66.6% { width: 0; }
      78% { width: 360px; }
      93% { width: 360px; }
      97% { width: 0; }
      100% { width: 0; }
    }

    /* =======================================================
       EFEITOS DE GLITCH VISÍVEIS
       ======================================================= */

    @keyframes glitchSpasm1 {
      0%, 45% {
        opacity: 0;
        clip-path: inset(50% 0 50% 0);
        transform: translate(0, 0);
      }
      46% {
        opacity: 0.95;
        clip-path: inset(10% 0 60% 0);
        transform: translate(-6px, -2px) skew(-5deg);
      }
      48% {
        opacity: 0.9;
        clip-path: inset(45% 0 15% 0);
        transform: translate(7px, 2px) skew(4deg);
      }
      50% {
        opacity: 0.85;
        clip-path: inset(70% 0 5% 0);
        transform: translate(-8px, 1px);
      }
      52% {
        opacity: 0.95;
        clip-path: inset(20% 0 55% 0);
        transform: translate(5px, -3px) skew(-3deg);
      }
      54%, 82% {
        opacity: 0;
        clip-path: inset(50% 0 50% 0);
        transform: translate(0, 0);
      }
      83% {
        opacity: 0.9;
        clip-path: inset(5% 0 75% 0);
        transform: translate(-10px, -1px) skew(6deg);
      }
      85% {
        opacity: 0.95;
        clip-path: inset(60% 0 20% 0);
        transform: translate(8px, 3px);
      }
      87% {
        opacity: 0;
        clip-path: inset(50% 0 50% 0);
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes glitchSpasm2 {
      0%, 45% {
        opacity: 0;
        clip-path: inset(50% 0 50% 0);
        transform: translate(0, 0);
      }
      47% {
        opacity: 0.9;
        clip-path: inset(30% 0 35% 0);
        transform: translate(6px, 2px) skew(5deg);
      }
      49% {
        opacity: 0.95;
        clip-path: inset(65% 0 10% 0);
        transform: translate(-7px, -1px) skew(-4deg);
      }
      51% {
        opacity: 0.85;
        clip-path: inset(15% 0 70% 0);
        transform: translate(9px, -2px);
      }
      53%, 83% {
        opacity: 0;
        clip-path: inset(50% 0 50% 0);
        transform: translate(0, 0);
      }
      84% {
        opacity: 0.9;
        clip-path: inset(40% 0 25% 0);
        transform: translate(-8px, 2px) skew(-5deg);
      }
      86% {
        opacity: 0.95;
        clip-path: inset(10% 0 65% 0);
        transform: translate(7px, -2px);
      }
      88% {
        opacity: 0;
        clip-path: inset(50% 0 50% 0);
      }
      100% {
        opacity: 0;
      }
    }

    /* Leve tremor de tela analógico periódico */
    @keyframes screenJitter {
      0%, 48%, 52%, 85%, 89%, 100% {
        transform: translate(0, 0);
      }
      49% {
        transform: translate(-1.5px, 1px);
      }
      50% {
        transform: translate(2px, -1px) scale(1.002);
      }
      51% {
        transform: translate(-1px, -1px);
      }
      86% {
        transform: translate(1px, 1px);
      }
      87% {
        transform: translate(-2px, 0);
      }
      88% {
        transform: translate(1px, -1px);
      }
    }

    @keyframes crtScan {
      0% { top: -100%; }
      100% { top: 100%; }
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 12px #39d353; }
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div class="scanlines"></div>
    <div class="crt-beam"></div>

    <div class="terminal-header">
      <div class="status-dot"></div>
      <span>DEVELOPER SYSTEM TERMINAL // SECURE_V3</span>
    </div>

    <div class="terminal-screen">
      <!-- Linha 1 -->
      <div class="terminal-line line-1">
        <span class="glitch-text" data-text="[ INITIALIZING ENVIRONMENT... ]">[ INITIALIZING ENVIRONMENT... ]</span>
        <span class="cursor"></span>
      </div>

      <!-- Linha 2 -->
      <div class="terminal-line line-2">
        <span class="glitch-text" data-text="[ ESTABLISHING SECURE CONNECTION ]">[ ESTABLISHING SECURE CONNECTION ]</span>
        <span class="cursor"></span>
      </div>

      <!-- Linha 3 -->
      <div class="terminal-line line-3">
        <span class="glitch-text" data-text="[ USER: JWsley AUTHORIZED ]">[ USER: JWsley AUTHORIZED ]</span>
        <span class="cursor"></span>
      </div>
    </div>
  </div>

</body>
</html>
